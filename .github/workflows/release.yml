name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/tytydraco/LADB.git
          git fetch --no-tags upstream main

          if ! git merge-base --is-ancestor upstream/main HEAD; then
            echo "::error::main is behind upstream/main."
            git log --oneline --no-decorate HEAD..upstream/main
            exit 1
          fi

      - name: Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::versionName not found."
            exit 1
          fi

          timestamp="$(date -u +%Y%m%d%H%M%S)"
          tag="v${version}-${timestamp}"
          apk="LADB-${version}.apk"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew :app:assembleRelease -PRELEASE_ANTIPIRACY=false --no-daemon --stacktrace

      - name: Load key
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ladb-release.jks"

      - name: Sign
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/ladb-aligned.apk"

          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          test -f "$unsigned_apk"
          mkdir -p dist

          "$build_tools/zipalign" -P 16 -f -v 4 "$unsigned_apk" "$aligned_apk"

          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/ladb-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/$APK_NAME" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "dist/$APK_NAME"
          "$build_tools/zipalign" -c -P 16 -v 4 "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          cp LICENSE dist/LICENSE.txt

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "dist/$APK_NAME" \
            "dist/$APK_NAME.sha256" \
            "dist/LICENSE.txt" \
            --target "$GITHUB_SHA" \
            --title "Release $RELEASE_TAG" \
            --notes ""

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ladb-release.jks" "$RUNNER_TEMP/ladb-aligned.apk"
